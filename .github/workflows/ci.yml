name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - codex-spmi-ready
    tags:
      - "staging-*"
      - "launch-candidate-*"
  pull_request:
    branches:
      - master
      - codex-spmi-ready

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  operations:
    name: Operations Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate shell scripts
        run: |
          bash -n scripts/preflight-staging.sh
          bash -n scripts/deploy-staging.sh
          bash -n scripts/status-staging.sh
          bash -n scripts/backup-staging.sh
          bash -n scripts/bootstrap-ubuntu-staging.sh
          bash -n scripts/preflight-production.sh
          bash -n scripts/launch-production.sh
          bash -n scripts/status-production.sh
          bash -n scripts/backup-production.sh
          bash -n scripts/bootstrap-ubuntu-production.sh
          bash -n scripts/generate-production-launch-secrets.sh
          bash -n scripts/prelaunch-accreditation.sh

      - name: Validate production smoke script
        run: |
          node -c scripts/smoke-production.js
          node -c backend-node/scripts/uat-accreditation.js
